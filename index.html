<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中学校英語単語帳 V2.0</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>中学校英語単語帳</h1><p>中1～中3＋高校入試向けて応援</p></div><div class="header-actions"><button id="themeBtn">🌙</button><button id="resetBtn">リセット记录</button></div></header>
<main>
<nav class="tabs"><button class="tab active" data-tab="cards">🃏 単語カード</button><button class="tab" data-tab="quiz">✏️ 四选一</button><button class="tab" data-tab="verbs">🔄 不規則動詞</button></nav>

<section class="features">
  <h2>V2.3 の機能</h2>
  <ul>
    <li>単語カードの裏面に英語例文・日本語訳・中国語訳を表示し、それぞれの読み上げに対応。</li>
    <li>単語は英式・米式のIPAを表示し、英式発音・米式発音の両方を再生可能。</li>
    <li>4択練習、未習得復習、学習進捗、端末保存、ダークモードに対応。</li>
    <li>高校入試でよく出る重要語彙と不規則動詞重点表を収録。</li>
    <li>中1・中2・中3・品詞で絞り込み、英語・中国語・日本語で検索可能。</li>
  </ul>
</section>
</main><footer>中学校英語単語帳 V2.0 · 教材横断核心語彙整理版</footer>
